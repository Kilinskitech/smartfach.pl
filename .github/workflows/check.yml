name: Kontrola jakości

on:
  pull_request:
  push:
    branches: [main, preview]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strona
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: strona/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
